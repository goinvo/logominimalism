<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Logo Evolution Explorer</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<style>
  :root {
    --bg: #ffffff;
    --panel-bg: #ffffff;
    --ink: #1c1c1a;
    --ink-muted: #6b6b67;
    --ink-faint: #9a9a95;
    --dot-grid: #dedcd6;
    --chart-bg: #fbfbf9;
    --axis: #8f8f8a;
    --rug: #b7b7b1;
    --card-bg: #ffffff;
    --card-border: #e6e5e0;

    --c-restaurants: #E8472A;
    --c-retail: #2563EB;
    --c-tech: #7C3AED;
    --c-fashion: #0D9488;
    --c-shipping: #D97706;
    --c-food: #DC2626;
    --c-auto: #475569;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    overflow-x: hidden;
  }

  #app {
    min-width: 900px;
    max-width: 1560px;
    margin: 0 auto;
    padding: 24px 28px 32px;
  }

  #hint-row {
    display: flex;
    align-items: flex-start;
    gap: 18px;
    margin-bottom: 10px;
  }

  #hint-filter {
    width: 148px;
    flex: none;
    font-size: 14px;
    font-weight: 600;
    color: var(--ink);
  }

  #layout {
    display: flex;
    align-items: flex-start;
    gap: 18px;
  }

  #filters {
    display: flex;
    flex-direction: column;
    gap: 5px;
    width: 148px;
    flex: none;
  }

  .filter-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    background: #ffffff;
    border: 1px solid #e2e2dd;
    color: var(--ink-muted);
    font-size: 12.5px;
    font-weight: 500;
    padding: 7px 10px;
    border-radius: 9px;
    cursor: pointer;
    text-align: left;
    transition: background 160ms ease, border-color 160ms ease, color 160ms ease;
  }

  .filter-btn:hover {
    border-color: #c9c9c2;
    color: var(--ink);
  }

  .filter-btn.active {
    background: #f2f2ee;
    border-color: var(--ink);
    color: var(--ink);
  }

  #chart-wrap {
    position: relative;
    flex: 1;
    min-width: 0;
    background-color: var(--chart-bg);
    background-image: radial-gradient(circle, var(--dot-grid) 1px, transparent 1.5px);
    background-size: 22px 22px;
    border: 1px solid #ececE7;
    border-radius: 10px;
  }

  svg#chart {
    display: block;
    width: 100%;
    height: 860px;
  }

  .zero-line { stroke: #cfcfc8; stroke-width: 1; stroke-dasharray: 2 4; }
  .axis-line { stroke: var(--axis); stroke-width: 1; opacity: 0.7; }
  .tick-line { stroke: var(--axis); stroke-width: 1; opacity: 0.7; }
  .tick-text { fill: var(--ink-muted); font-size: 12px; }
  .year-tick-text { font-size: 11.5px; }
  .axis-caption { fill: var(--ink-muted); font-size: 12.5px; font-weight: 500; }

  .hint-tick { stroke: #E8472A; stroke-width: 2.5; stroke-linecap: round; }
  .hint-text { fill: var(--ink); font-size: 13px; font-weight: 600; }

  .slider-track { stroke: var(--axis); stroke-width: 2; stroke-linecap: round; }
  .slider-handle {
    fill: var(--ink);
    stroke: #ffffff;
    stroke-width: 2.5;
    cursor: grab;
  }
  .slider-handle:active { cursor: grabbing; }
  .slider-cheer { stroke: #E8472A; stroke-width: 2.5; stroke-linecap: round; }
  .slider-caption { fill: var(--ink); font-size: 13.5px; font-weight: 500; }

  g.node.year-hidden {
    opacity: 0 !important;
    pointer-events: none;
  }

  g.dots-layer {
    transition: opacity 280ms ease;
  }

  g.dots-layer.explore-hidden {
    opacity: 0;
    pointer-events: none;
  }

  circle.node-bg {
    transition: r 300ms ease, fill 300ms ease, fill-opacity 300ms ease;
    cursor: pointer;
  }

  circle.node-ring {
    transition: r 300ms ease, stroke 300ms ease, stroke-width 300ms ease;
    pointer-events: none;
  }

  circle.hit {
    fill: transparent;
    cursor: pointer;
  }

  image.node-logo {
    cursor: pointer;
    transition: opacity 220ms ease;
  }

  text.fallback-initials {
    fill: #fff;
    font-size: 10px;
    font-weight: 700;
    text-anchor: middle;
    dominant-baseline: middle;
    pointer-events: none;
    transition: opacity 220ms ease;
  }

  .explode-path {
    fill: none;
    stroke: var(--ink-faint);
    stroke-width: 1.5;
    stroke-dasharray: 3 4;
  }

  g.explode-node { cursor: pointer; }
  circle.explode-ring { pointer-events: none; }

  .explode-year {
    font-size: 12.5px;
    font-weight: 500;
    fill: var(--ink-muted);
    pointer-events: none;
  }

  .explode-back {
    position: absolute;
    top: 14px;
    left: 14px;
    z-index: 5;
    background: #ffffff;
    border: 1px solid #e2e2dd;
    color: var(--ink);
    font-size: 12.5px;
    font-weight: 600;
    padding: 7px 12px;
    border-radius: 8px;
    cursor: pointer;
    opacity: 0;
    pointer-events: none;
    transform: translateY(-4px);
    transition: opacity 200ms ease, transform 200ms ease;
  }

  .explode-back.visible {
    opacity: 1;
    pointer-events: auto;
    transform: translateY(0);
  }

  #tooltip {
    position: fixed;
    pointer-events: none;
    background: #ffffff;
    border: 1px solid #e2e2dd;
    color: var(--ink);
    font-size: 12px;
    padding: 6px 10px;
    border-radius: 6px;
    opacity: 0;
    transition: opacity 120ms ease;
    z-index: 50;
    max-width: 220px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.10);
  }

  #tooltip.visible { opacity: 1; }
  #tooltip .t-brand { font-weight: 700; }
  #tooltip .t-sub { color: var(--ink-muted); margin-top: 2px; }

  @media (max-width: 720px) {
    #app { min-width: 0; padding: 16px 12px 24px; }
    #hint-row { flex-direction: column; gap: 6px; margin-bottom: 12px; }
    #hint-filter { width: auto; }
    #layout { flex-direction: column; }
    #filters { width: 100%; flex-direction: row; flex-wrap: wrap; }
    .filter-btn { flex: 1 1 auto; }
    svg#chart { height: 640px; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="hint-row">
    <div id="hint-filter">Filter by industry</div>
  </div>
  <div id="layout">
    <nav id="filters"></nav>
    <div id="chart-wrap">
      <button id="explode-back" class="explode-back" type="button">&larr; All brands</button>
      <svg id="chart"></svg>
    </div>
  </div>
</div>

<div id="tooltip"></div>

<script>
const INDUSTRIES = [
  { key: "all",         label: "All" },
  { key: "restaurants",  label: "Restaurants" },
  { key: "retail",       label: "Retail" },
  { key: "tech",         label: "Tech" },
  { key: "fashion",      label: "Fashion" },
  { key: "shipping",     label: "Shipping" },
  { key: "food",         label: "Food & CPG" },
  { key: "auto",         label: "Auto" },
];

const ACCENT = "#E8472A"; // circle borders are always this red now — no more per-industry color coding

const BADGE_LABEL = {
  simplified: "Simplified",
  more_complex: "More complex",
  no_significant_change: "No significant change",
};

const CONTEXT_R = 6;
const CONTEXT_R_DIM = 5;
const FOCUS_R = 34; // 68px diameter
const EXPLODE_R = 64; // logo history is the emphasis once opened
const CURRENT_YEAR = new Date().getFullYear();

let activeIndustry = "restaurants";
let nodes = [];
let timelinesByBrand = new Map();
let simulation;
// extra height/bottom-margin (added in lockstep, so the existing plot area
// keeps its exact prior pixel geometry) reserved for the year slider strip
const SLIDER_ZONE = 90;
let width = 0, height = 860 + SLIDER_ZONE;
let hintDismissed = false;
const margin = { top: 50, right: 32, bottom: 92 + SLIDER_ZONE, left: 64 };

let sliderYear;
let sliderDragging = false;

const svg = d3.select("#chart");
const gAxis = svg.append("g").attr("class", "axis-layer");
const gDots = svg.append("g").attr("class", "dots-layer");
const gExplode = svg.append("g").attr("class", "explode-layer");
const gExplodeLines = gExplode.append("g").attr("class", "explode-lines");
const gExplodeDots = gExplode.append("g").attr("class", "explode-dots");
const gHint = svg.append("g").attr("class", "hint-layer").style("pointer-events", "none");
const gSlider = svg.append("g").attr("class", "slider-layer");

let scoreScale;
let xScale;
let axisStartYear = 1970; // recomputed from the earliest real data year once loaded
let edgeDensityMean = 0, edgeDensityStd = 1;

let explodedBrand = null;
let explodeNodes = [];
let explodeSim = null;

function slug(s) {
  return s.replace(/[^a-zA-Z0-9]/g, "-");
}

function initials(name) {
  const words = name.replace(/[^A-Za-z0-9\s]/g, "").trim().split(/\s+/).filter(Boolean);
  if (words.length >= 2) return (words[0][0] + words[1][0]).toUpperCase();
  return name.replace(/[^A-Za-z0-9]/g, "").slice(0, 2).toUpperCase();
}

function buildFilters() {
  const wrap = d3.select("#filters");
  const btns = wrap.selectAll(".filter-btn")
    .data(INDUSTRIES, d => d.key)
    .enter()
    .append("button")
    .attr("class", d => "filter-btn" + (d.key === activeIndustry ? " active" : ""))
    .attr("data-key", d => d.key);

  btns.append("span").text(d => d.label);

  btns.on("click", (event, d) => setIndustry(d.key));
}

function setIndustry(key) {
  activeIndustry = key;
  d3.selectAll(".filter-btn").classed("active", d => d.key === key);
  closeExplode();
  updateFocusState();
}

function setXScale(domain) {
  xScale = d3.scaleLinear().domain(domain).range([margin.left, width - margin.right]);
}

function baseXDomain() {
  return [axisStartYear, CURRENT_YEAR];
}

function measureWidth() {
  const rect = document.getElementById("chart-wrap").getBoundingClientRect();
  width = Math.max(760, rect.width);
  svg.attr("viewBox", `0 0 ${width} ${height}`);
  setXScale(baseXDomain());
}

function computeEdgeDensityStats(timelines) {
  const vals = timelines.map(r => r.edge_density).filter(v => typeof v === "number" && !isNaN(v));
  edgeDensityMean = d3.mean(vals);
  edgeDensityStd = d3.deviation(vals) || 1;
}

function edgeDensityZ(v) {
  if (v == null || isNaN(v)) return 0;
  return (v - edgeDensityMean) / edgeDensityStd;
}

function clampToScoreDomain(v) {
  const [lo, hi] = scoreScale.domain();
  return Math.max(lo + 0.1, Math.min(hi - 0.1, v));
}

function buildScale(data) {
  const vals = data.map(d => d.complexity_change_score).filter(v => !isNaN(v));
  const dataMin = d3.min(vals);
  const dataMax = d3.max(vals);
  const lo = Math.min(-2, dataMin) - 0.15;
  const hi = Math.max(2, dataMax) + 0.15;
  // reversed range: higher (more complex) score renders near the top
  scoreScale = d3.scaleLinear().domain([lo, hi]).range([height - margin.bottom, margin.top]);
}

function xAxisTickYears() {
  if (explodedBrand) {
    // zoomed to one brand's own year span — let d3 pick sensible round ticks
    // for whatever narrower range is currently in view
    return xScale.ticks(6).filter(y => Number.isInteger(y));
  }
  const [startYear] = xScale.domain();
  const step = (CURRENT_YEAR - startYear) > 70 ? 20 : 10;
  const base = [];
  for (let y = startYear; y < CURRENT_YEAR; y += step) base.push(y);
  // drop the last regular tick if it would sit too close to the "present" tick
  const filtered = base.filter(y => CURRENT_YEAR - y > 3);
  return [...filtered, CURRENT_YEAR];
}

function drawAxis() {
  gAxis.selectAll("*").remove();

  const plotTop = margin.top - 16, plotBottom = height - margin.bottom + 16;

  const zeroY = scoreScale(0);
  gAxis.append("line")
    .attr("class", "zero-line")
    .attr("x1", margin.left - 10).attr("x2", width - margin.right + 10)
    .attr("y1", zeroY).attr("y2", zeroY);

  gAxis.append("line")
    .attr("class", "axis-line")
    .attr("x1", margin.left).attr("x2", margin.left)
    .attr("y1", plotTop).attr("y2", plotBottom);

  const ticks = [-2, -1, 0, 1, 2];
  const tickG = gAxis.selectAll(".tick-g")
    .data(ticks)
    .enter()
    .append("g")
    .attr("class", "tick-g")
    .attr("transform", d => `translate(${margin.left}, ${scoreScale(d)})`);

  tickG.append("line").attr("class", "tick-line").attr("x1", -6).attr("x2", 0);
  tickG.append("text")
    .attr("class", "tick-text")
    .attr("x", -12)
    .attr("dy", "0.32em")
    .attr("text-anchor", "end")
    .text(d => (d > 0 ? "+" + d : d));

  gAxis.append("text")
    .attr("class", "axis-caption")
    .attr("x", margin.left)
    .attr("y", margin.top - 26)
    .attr("text-anchor", "start")
    .text("more complex ↑");

  gAxis.append("text")
    .attr("class", "axis-caption")
    .attr("x", margin.left)
    .attr("y", height - margin.bottom + 74)
    .attr("text-anchor", "start")
    .text("more simple ↓");

  // year (x) axis, along the bottom — the collapsed complexity dots live in
  // the shaded present-day band on the right; clicking one spreads its own
  // version history back across this same timeline by real year.
  gAxis.append("line")
    .attr("class", "axis-line")
    .attr("x1", margin.left).attr("x2", width - margin.right)
    .attr("y1", plotBottom).attr("y2", plotBottom);

  const yearTicks = xAxisTickYears();
  const yearG = gAxis.selectAll(".year-tick-g")
    .data(yearTicks)
    .enter()
    .append("g")
    .attr("class", "year-tick-g")
    .attr("transform", d => `translate(${xScale(d)}, ${plotBottom})`);

  yearG.append("line").attr("class", "tick-line").attr("x1", 0).attr("x2", 0).attr("y1", 0).attr("y2", 6);
  yearG.append("text")
    .attr("class", "tick-text year-tick-text")
    .attr("y", 20)
    .attr("text-anchor", d => {
      const x = xScale(d);
      if (x <= margin.left + 20) return "start";
      if (x >= width - margin.right - 20) return "end";
      return "middle";
    })
    .text(d => (d === CURRENT_YEAR && !explodedBrand) ? `${d} (present)` : d);
}

function latestLogoRow(brand) {
  const rows = timelinesByBrand.get(brand) || [];
  if (!rows.length) return null;
  return rows.slice().sort((a, b) => b.year - a.year)[0];
}

// Whichever version of a brand's logo was actually current as of a given
// year — the slider's whole premise is "what did the logo landscape look
// like back then," so a brand redesigned in 2015 should still show its
// pre-2015 mark when the slider sits at, say, 2005 rather than jumping
// straight to today's logo the moment the brand exists at all.
function rowAsOfYear(brand, year) {
  const rows = timelinesByBrand.get(brand) || [];
  const eligible = rows.filter(r => r.year <= year);
  if (!eligible.length) return null;
  return eligible.reduce((latest, r) => (r.year > latest.year ? r : latest));
}

// Drives the year slider at the bottom of the chart: brands that didn't
// exist yet as of sliderYear disappear entirely (context dots and focused
// ones alike), and any focused dot still visible swaps to whichever logo
// was actually current back then instead of always showing today's mark.
function applyYearFilter() {
  gDots.selectAll("g.node").each(function (d) {
    const asOf = rowAsOfYear(d.brand, sliderYear);
    const g = d3.select(this);
    g.classed("year-hidden", !asOf);
    if (!asOf) return;
    if (d._focused) applyFocusedVisual(g, d, asOf);
  });
}

// Each dot's real x position on the timeline — wherever its logo as of
// sliderYear actually falls — rather than the whole collapsed view always
// clustering in one fixed spot regardless of what the slider is doing.
// Nodes with no eligible version yet are hidden anyway, so their target
// value here is never actually seen.
function xTargetFor(d) {
  const asOf = rowAsOfYear(d.brand, sliderYear);
  const year = asOf ? asOf.year : CURRENT_YEAR;
  return xScale(Math.max(xScale.domain()[0], Math.min(CURRENT_YEAR, year)));
}

function repositionForYear() {
  if (!simulation) return;
  simulation.force("x", d3.forceX(xTargetFor).strength(0.25));
  simulation.alpha(0.6).restart();
}

// The hint (cheer lines + caption) only ever shows once, in the slider's
// untouched resting position, then is gone for good the moment the user
// actually interacts — same "dismiss on first use" pattern as the other
// hint on this chart.
let sliderInteracted = false;

function drawSlider() {
  gSlider.selectAll("*").remove();
  gSlider.attr("data-year", sliderYear);

  const trackY = height - margin.bottom + 100;
  const x0 = margin.left, x1 = width - margin.right;

  gSlider.append("line")
    .attr("class", "slider-track")
    .attr("x1", x0).attr("x2", x1)
    .attr("y1", trackY).attr("y2", trackY);

  const handleX = xScale(sliderYear);

  if (!sliderInteracted) {
    // The handle starts at the far-right "present" end of the track, so
    // the hint sits to its LEFT — anchoring it to the right would push
    // the text straight off the edge of the chart.
    const cheerX = handleX - 46, cheerY = trackY;
    [[-8, -14], [2, -20], [12, -14]].forEach(([dx, dy]) => {
      gSlider.append("line")
        .attr("class", "slider-cheer")
        .attr("x1", cheerX + dx).attr("y1", cheerY - dy)
        .attr("x2", cheerX + dx * 1.6).attr("y2", cheerY - dy * 1.7);
    });

    gSlider.append("text")
      .attr("class", "slider-caption")
      .attr("x", cheerX - 16)
      .attr("y", cheerY + 5)
      .attr("text-anchor", "end")
      .text("use the slider to see logos up to that year!");
  }

  const handle = gSlider.append("circle")
    .attr("class", "slider-handle")
    .attr("r", 8)
    .attr("cx", handleX)
    .attr("cy", trackY);

  // The handle's on-screen position tracks the mouse continuously (that's
  // what makes the drag feel smooth) while the underlying sliderYear only
  // commits — and only then re-filters/re-layouts the chart — once it
  // actually crosses into a new whole year, rather than on every pixel of
  // movement. Redrawing the whole slider (and re-running the force
  // simulation) on every mousemove was what made the old version feel
  // stepped/janky instead of like a real slide.
  function commitToPixel(clampedX) {
    handle.attr("cx", clampedX);
    const rawYear = xScale.invert(clampedX);
    const domainMin = Math.ceil(xScale.domain()[0]);
    const rounded = Math.max(domainMin, Math.min(CURRENT_YEAR, Math.round(rawYear)));
    if (rounded === sliderYear) return;
    sliderYear = rounded;
    gSlider.attr("data-year", sliderYear);
    applyYearFilter();
    repositionForYear();
  }

  handle.call(
    d3.drag()
      .on("start", () => {
        sliderDragging = true;
        if (!sliderInteracted) {
          sliderInteracted = true;
          gSlider.selectAll(".slider-cheer, .slider-caption").remove();
        }
      })
      .on("drag", (event) => {
        commitToPixel(Math.max(x0, Math.min(x1, event.x)));
      })
      .on("end", () => { sliderDragging = false; })
  );

  // clicking anywhere on the track jumps the handle straight there, rather
  // than making a user precisely grab an 8px circle to start interacting
  gSlider.append("line")
    .attr("x1", x0).attr("x2", x1)
    .attr("y1", trackY).attr("y2", trackY)
    .attr("stroke", "transparent")
    .attr("stroke-width", 20)
    .style("cursor", "pointer")
    .on("click", (event) => {
      if (!sliderInteracted) {
        sliderInteracted = true;
        gSlider.selectAll(".slider-cheer, .slider-caption").remove();
      }
      const [mx] = d3.pointer(event);
      commitToPixel(Math.max(x0, Math.min(x1, mx)));
    });
}

function initSim(data) {
  nodes = data.map(d => ({
    ...d,
    r: CONTEXT_R,
    y: scoreScale(d.complexity_change_score),
    x: xTargetFor(d) + (Math.random() - 0.5) * 30,
  }));

  simulation = d3.forceSimulation(nodes)
    .force("y", d3.forceY(d => scoreScale(d.complexity_change_score)).strength(1))
    .force("x", d3.forceX(xTargetFor).strength(0.25))
    .force("collide", d3.forceCollide(d => d.r + 1))
    .alphaDecay(0.05)
    .velocityDecay(0.5)
    .on("tick", ticked)
    .stop();

  for (let i = 0; i < 260; i++) simulation.tick();
}

function clampNode(d) {
  d.x = Math.max(margin.left + d.r + 6, Math.min(width - margin.right - d.r - 6, d.x));
  d.y = Math.max(margin.top + d.r, Math.min(height - margin.bottom - d.r, d.y));
}

function ticked() {
  nodes.forEach(clampNode);
  gDots.selectAll("g.node").attr("transform", d => `translate(${d.x}, ${d.y})`);
  if (!hintDismissed) updateLogoHint();
}

function pickHintTarget() {
  const focused = nodes.filter(n => n._focused);
  if (!focused.length) return null;
  return focused.reduce((top, n) => (n.y < top.y ? n : top));
}

function updateLogoHint() {
  const target = pickHintTarget();
  gHint.selectAll("*").remove();
  if (!target) return;

  const cx = target.x, cy = target.y, r = target.r;

  // three short "cheer" strokes fanning out toward the upper-right, like a sparkle accent
  [-55, -10, 35].forEach(deg => {
    const rad = deg * Math.PI / 180;
    const x1 = cx + Math.cos(rad) * (r + 7);
    const y1 = cy + Math.sin(rad) * (r + 7);
    const x2 = cx + Math.cos(rad) * (r + 24);
    const y2 = cy + Math.sin(rad) * (r + 24);
    gHint.append("line")
      .attr("class", "hint-tick")
      .attr("x1", x1).attr("y1", y1).attr("x2", x2).attr("y2", y2);
  });

  // Route the label to the open space just left of the circle, clamped so
  // it never gets pushed past the left edge of the plot for a dot sitting
  // early on the timeline.
  const tx = Math.max(margin.left + 4, cx - r - 14);
  const text = gHint.append("text")
    .attr("class", "hint-text")
    .attr("x", tx)
    .attr("y", cy - 6)
    .attr("text-anchor", "end");
  text.append("tspan").attr("x", tx).attr("dy", 0).text("Click the logo to learn");
  text.append("tspan").attr("x", tx).attr("dy", "1.3em").text("about its brand history!");
}

function dismissHint() {
  hintDismissed = true;
  gHint.selectAll("*").remove();
}

function renderDots() {
  const groups = gDots.selectAll("g.node")
    .data(nodes, d => d.brand)
    .enter()
    .append("g")
    .attr("class", "node");

  groups.append("clipPath")
    .attr("id", d => `clip-${slug(d.brand)}`)
    .append("circle")
    .attr("r", CONTEXT_R);

  groups.append("circle")
    .attr("class", "node-bg")
    .attr("r", CONTEXT_R)
    .attr("fill", "var(--rug)");

  groups.append("image")
    .attr("class", "node-logo")
    .attr("clip-path", d => `url(#clip-${slug(d.brand)})`)
    .attr("preserveAspectRatio", "xMidYMid meet")
    .style("opacity", 0);

  // drawn after the image (i.e. on top) so its ring isn't undercut by the
  // clipped logo's edge — a plain fill+stroke circle behind the image can
  // let square logo corners peek past the circle's edge (seen on Wendy's)
  groups.append("circle")
    .attr("class", "node-ring")
    .attr("r", CONTEXT_R)
    .attr("fill", "none");

  groups.append("text")
    .attr("class", "fallback-initials")
    .style("opacity", 0);

  groups.append("circle")
    .attr("class", "hit")
    .attr("r", 10);

  groups
    .on("mousemove", (event, d) => showTooltip(event, d))
    .on("mouseleave", hideTooltip)
    .on("click", (event, d) => {
      event.stopPropagation();
      dismissHint();
      explodeBrand(d);
    });
}

function showTooltip(event, d) {
  const tt = d3.select("#tooltip");
  tt.html(
    `<div class="t-brand">${d.brand}</div>` +
    `<div class="t-sub">${d.year_first}–${d.year_last} · ${BADGE_LABEL[d.complexity_label] || d.complexity_label}</div>` +
    `<div class="t-sub">complexity change: ${d.complexity_change_score > 0 ? "+" : ""}${d.complexity_change_score.toFixed(2)}</div>`
  );
  tt.classed("visible", true)
    .style("left", (event.clientX + 16) + "px")
    .style("top", (event.clientY + 12) + "px");
}

function hideTooltip() {
  d3.select("#tooltip").classed("visible", false);
}

function applyFocusedVisual(g, d, rowOverride) {
  const bg = g.select("circle.node-bg");
  const ring = g.select("circle.node-ring");
  const img = g.select("image.node-logo");
  const fallback = g.select("text.fallback-initials");
  const row = rowOverride !== undefined ? rowOverride : latestLogoRow(d.brand);

  fallback.text(initials(d.brand));

  if (!row) {
    bg.attr("fill", ACCENT);
    ring.attr("stroke", "none");
    img.style("opacity", 0);
    fallback.style("opacity", 1);
    return;
  }

  const src = `logos/${encodeURIComponent(d.brand)}/${encodeURIComponent(row.filename)}`;
  bg.attr("fill", "var(--card-bg)");
  ring.attr("stroke", ACCENT).attr("stroke-width", 2.5);
  fallback.style("opacity", 0);
  img
    .attr("width", d.r * 1.5)
    .attr("height", d.r * 1.5)
    .attr("x", -d.r * 0.75)
    .attr("y", -d.r * 0.75)
    .style("opacity", 1)
    .on("error", function() {
      bg.attr("fill", ACCENT);
      ring.attr("stroke", "none");
      d3.select(this).style("opacity", 0);
      fallback.style("opacity", 1);
    })
    .attr("href", src);
}

function updateFocusState() {
  const focusOn = activeIndustry !== "all";

  gDots.selectAll("g.node").each(function(d) {
    d._focused = focusOn && d.industry === activeIndustry;
    d.r = d._focused ? FOCUS_R : (focusOn ? CONTEXT_R_DIM : CONTEXT_R);
  });

  const sel = gDots.selectAll("g.node");

  sel.select("clipPath circle").attr("r", d => d.r);
  sel.select("circle.hit").attr("r", d => Math.max(10, d.r));
  sel.select("circle.node-bg")
    .attr("r", d => d.r)
    .style("fill-opacity", d => !focusOn ? 1 : (d._focused ? 1 : 0.55));
  sel.select("circle.node-ring").attr("r", d => d.r);

  sel.each(function(d) {
    const g = d3.select(this);
    if (d._focused) {
      applyFocusedVisual(g, d);
    } else {
      g.select("circle.node-bg").attr("fill", "var(--rug)");
      g.select("circle.node-ring").attr("stroke", "none");
      g.select("image.node-logo").style("opacity", 0);
      g.select("text.fallback-initials").style("opacity", 0);
    }
  });

  simulation.force("collide", d3.forceCollide(d => d.r + (focusOn ? 3 : 1)));
  simulation.alpha(0.9).restart();

  applyYearFilter();
}

// Turns a single "present day" summary dot into that brand's full version
// history, spread across the real timeline by year. Y uses each version's
// own structural complexity (edge density, z-scored against the whole
// dataset) rather than the summary's first-vs-last delta — a different but
// comparable metric, since there's no per-intermediate-version equivalent of
// the summary score in the data.
function explodeBrand(d) {
  if (explodedBrand === d.brand) {
    closeExplode();
    return;
  }

  const rows = (timelinesByBrand.get(d.brand) || []).slice().sort((a, b) => a.year - b.year);
  if (!rows.length) return;

  explodedBrand = d.brand;
  const origin = { x: d.x, y: d.y };

  // Zoom the x-axis to this brand's own year span (padded) instead of the
  // full historical range, so its versions spread across nearly the whole
  // width rather than being squeezed into whatever sliver of the timeline
  // they actually span — the whole point of "exploding" is to make the
  // history fill the view.
  const years = rows.map(r => r.year);
  const yrMin = d3.min(years), yrMax = d3.max(years);
  const span = Math.max(yrMax - yrMin, 6);
  const pad = Math.max(2, Math.round(span * 0.18));
  setXScale([yrMin - pad, yrMax + pad]);
  drawAxis();

  explodeNodes = rows.map((r, i) => ({
    brand: d.brand,
    industry: d.industry,
    year: r.year,
    filename: r.filename,
    changeScore: r.change_score,
    isFirst: i === 0,
    r: EXPLODE_R,
    targetX: xScale(r.year),
    targetY: scoreScale(clampToScoreDomain(edgeDensityZ(r.edge_density))),
    x: 0, y: 0,
  }));

  runExplodeSim();
  gDots.classed("explore-hidden", true);
  gSlider.style("opacity", 0).style("pointer-events", "none");
  renderExplodeNodes(origin);
  updateBackButton();
}

function runExplodeSim() {
  if (explodeSim) explodeSim.stop();
  // x is pinned to the real year (fx) so the timeline stays accurate — all
  // collision resolution among nearby-year versions happens on y instead,
  // which has plenty of room now that the collapsed dot plot is hidden.
  // tiny random offset so nodes whose target y values are nearly identical
  // (e.g. two versions with very similar complexity) don't start the
  // simulation exactly on top of each other, which can trap the collision
  // force with no clear direction to push them apart
  explodeNodes.forEach(n => { n.x = n.targetX; n.fx = n.targetX; n.y = n.targetY + (Math.random() - 0.5) * 4; });

  // Plot-edge containment has to run as a force *during* the simulation,
  // not a clamp applied afterward — clamping post-hoc can collapse multiple
  // nodes that the collision force had already separated (but pushed past
  // the edge) onto the exact same boundary value, undoing the separation.
  function boundsForce() {
    for (const n of explodeNodes) {
      const top = margin.top + n.r, bottom = height - margin.bottom - n.r;
      if (n.y < top) n.y += (top - n.y) * 0.3;
      else if (n.y > bottom) n.y -= (n.y - bottom) * 0.3;
    }
  }

  explodeSim = d3.forceSimulation(explodeNodes)
    .force("y", d3.forceY(n => n.targetY).strength(0.22))
    .force("collide", d3.forceCollide(n => n.r + 6).iterations(4))
    .force("bounds", boundsForce)
    .alphaDecay(0.02)
    .stop();

  for (let i = 0; i < 400; i++) explodeSim.tick();

  assignLabelSides(explodeNodes);
}

// The year label defaults to sitting just below each circle. When another
// circle has settled close enough beneath to collide with that label (e.g.
// two versions land near each other after collision resolution), flip the
// label above instead.
// Greedy label placement: for each node (processed left-to-right), try a
// handful of candidate spots around its circle — straight below, straight
// above, then below/above nudged sideways — and take the first one that
// clashes with neither another circle nor an already-placed label. Plain
// above/below isn't enough once three-plus circles crowd close together
// (e.g. Applebee's 1980–85), since freeing one label from one neighbor can
// just walk it into another; the sideways options give it more escape routes.
function assignLabelSides(list) {
  const LABEL_HALF_W = 22, LABEL_HALF_H = 9;

  function candidatesFor(n) {
    const sideShift = n.r * 0.85;
    const belowDy = n.r + 20, aboveDy = -(n.r + 14);
    return [
      { dx: 0, dy: belowDy, above: false },
      { dx: 0, dy: aboveDy, above: true },
      { dx: sideShift, dy: belowDy, above: false },
      { dx: -sideShift, dy: belowDy, above: false },
      { dx: sideShift, dy: aboveDy, above: true },
      { dx: -sideShift, dy: aboveDy, above: true },
    ];
  }

  const placed = [];

  function collidesAt(absX, absY, exclude) {
    const hitsCircle = list.some(o => o !== exclude &&
      Math.abs(o.x - absX) < o.r + LABEL_HALF_W &&
      Math.abs(o.y - absY) < o.r + LABEL_HALF_H);
    if (hitsCircle) return true;
    return placed.some(p => Math.abs(p.x - absX) < LABEL_HALF_W * 2 && Math.abs(p.y - absY) < LABEL_HALF_H * 2);
  }

  list.slice().sort((a, b) => a.x - b.x).forEach(n => {
    const cands = candidatesFor(n);
    let chosen = cands[0];
    for (const c of cands) {
      if (!collidesAt(n.x + c.dx, n.y + c.dy, n)) { chosen = c; break; }
    }
    n.labelAbove = chosen.above;
    n.labelDx = chosen.dx;
    n.labelDy = chosen.dy;
    placed.push({ x: n.x + chosen.dx, y: n.y + chosen.dy });
  });
}

function renderExplodeNodes(origin) {
  gExplodeLines.selectAll("*").remove();
  gExplodeDots.selectAll("*").remove();

  const linePath = d3.line().x(n => n.x).y(n => n.y).curve(d3.curveCatmullRom.alpha(0.6));
  gExplodeLines.append("path")
    .attr("class", "explode-path")
    .attr("d", linePath(explodeNodes))
    .style("opacity", 0)
    .transition().duration(500).delay(150).style("opacity", 1);

  const groups = gExplodeDots.selectAll("g.explode-node")
    .data(explodeNodes)
    .enter()
    .append("g")
    .attr("class", "explode-node")
    .attr("transform", `translate(${origin.x},${origin.y})`);

  groups.append("clipPath")
    .attr("id", (d, i) => `explode-clip-${i}`)
    .append("circle").attr("r", EXPLODE_R);

  groups.append("circle")
    .attr("class", "explode-bg")
    .attr("r", EXPLODE_R)
    .attr("fill", "var(--card-bg)");

  groups.append("image")
    .attr("class", "explode-logo")
    .attr("clip-path", (d, i) => `url(#explode-clip-${i})`)
    .attr("preserveAspectRatio", "xMidYMid meet")
    .attr("width", EXPLODE_R * 1.7)
    .attr("height", EXPLODE_R * 1.7)
    .attr("x", -EXPLODE_R * 0.85)
    .attr("y", -EXPLODE_R * 0.85)
    .attr("href", d => `logos/${encodeURIComponent(d.brand)}/${encodeURIComponent(d.filename)}`)
    .on("error", function () { d3.select(this).style("opacity", 0); });

  // on top of the image (not behind it, like explode-bg) so the ring's inner
  // edge isn't undercut by the clipped logo's own edge pixels
  groups.append("circle")
    .attr("class", "explode-ring")
    .attr("r", EXPLODE_R)
    .attr("fill", "none")
    .attr("stroke", ACCENT)
    .attr("stroke-width", 4);

  groups.append("text")
    .attr("class", "explode-year")
    .attr("x", d => d.labelDx)
    .attr("y", d => d.labelDy)
    .attr("text-anchor", "middle")
    .text(d => d.year);

  groups
    .on("mousemove", (event, d) => showExplodeTooltip(event, d))
    .on("mouseleave", hideTooltip)
    .on("click", (event) => { event.stopPropagation(); closeExplode(); });

  groups.transition()
    .duration(600)
    .ease(d3.easeCubicOut)
    .attr("transform", d => `translate(${d.x},${d.y})`);
}

function showExplodeTooltip(event, d) {
  const tt = d3.select("#tooltip");
  const changeLine = d.isFirst
    ? "first known version"
    : `${d.changeScore > 0 ? "+" : ""}${(d.changeScore ?? 0).toFixed(2)} complexity`;
  tt.html(
    `<div class="t-brand">${d.brand} · ${d.year}</div>` +
    `<div class="t-sub">${changeLine}</div>`
  );
  tt.classed("visible", true)
    .style("left", (event.clientX + 16) + "px")
    .style("top", (event.clientY + 12) + "px");
}

function updateBackButton() {
  d3.select("#explode-back").classed("visible", !!explodedBrand);
}

function closeExplode() {
  if (!explodedBrand) return;
  explodedBrand = null;

  setXScale(baseXDomain());
  drawAxis();
  drawSlider();

  gExplodeDots.selectAll("g.explode-node")
    .transition().duration(280)
    .style("opacity", 0)
    .remove();

  gExplodeLines.selectAll(".explode-path")
    .transition().duration(200)
    .style("opacity", 0)
    .remove();

  gDots.classed("explore-hidden", false);
  gSlider.style("opacity", 1).style("pointer-events", "auto");

  updateBackButton();
}

document.getElementById("explode-back").addEventListener("click", (event) => {
  event.stopPropagation();
  closeExplode();
});

document.addEventListener("click", () => {
  if (!explodedBrand) return;
  closeExplode();
});

Promise.all([
  d3.csv("data/summary.csv", d3.autoType),
  d3.csv("data/timelines.csv", d3.autoType),
]).then(([summary, timelines]) => {
  timelines.forEach(r => {
    if (!timelinesByBrand.has(r.brand)) timelinesByBrand.set(r.brand, []);
    timelinesByBrand.get(r.brand).push(r);
  });

  computeEdgeDensityStats(timelines);
  const earliestYear = d3.min(timelines, r => r.year);
  axisStartYear = Math.floor(earliestYear / 5) * 5;
  sliderYear = CURRENT_YEAR;

  buildFilters();
  measureWidth();
  buildScale(summary);
  drawAxis();
  drawSlider();
  initSim(summary);
  renderDots();
  ticked();
  updateFocusState();

  window.addEventListener("resize", () => {
    closeExplode();
    measureWidth();
    buildScale(summary);
    drawAxis();
    drawSlider();
    simulation.force("y", d3.forceY(d => scoreScale(d.complexity_change_score)).strength(1));
    simulation.force("x", d3.forceX(xTargetFor).strength(0.25));
    simulation.alpha(0.6).restart();
  });
}).catch(err => {
  console.error("Failed to load data", err);
  d3.select("#chart-wrap").append("div")
    .style("color", "#c0392b")
    .style("padding", "24px")
    .text("Failed to load data/summary.csv or data/timelines.csv. Serve this folder with `python3 -m http.server 8000` and open it via http://localhost, not file://.");
});
</script>
