<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Logo Timeline, 1970–2026 (Before/After)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<style>
  :root {
    --page-bg: #f5f5f4;
    --card-bg: #ffffff;
    --ink: #1c1c1a;
    --ink-muted: #6b6b67;
    --ink-faint: #9a9a95;
    --border: #e2e2dd;
    --logo-card-bg: #fbfbf9;
    --placeholder-bg: #c6faf6;
    --placeholder-ink: #12403c;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--page-bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }

  #page {
    display: flex;
    align-items: flex-start;
    gap: 24px;
    max-width: 1420px;
    margin: 32px auto 80px;
    padding: 0 24px;
  }

  #year-nav {
    flex: none;
    width: 190px;
    position: sticky;
    top: 24px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 10px;
    max-height: calc(100vh - 48px);
    overflow-y: auto;
  }

  .nav-decade-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    background: none;
    border: none;
    font-family: inherit;
    font-size: 16px;
    font-weight: 700;
    color: var(--ink);
    padding: 8px 6px;
    border-radius: 8px;
    cursor: pointer;
    text-align: left;
  }

  .nav-decade-header:hover { background: var(--logo-card-bg); }

  .nav-chevron {
    color: var(--ink-faint);
    font-size: 12px;
    transition: transform 200ms ease;
  }

  .nav-decade.expanded .nav-chevron { transform: rotate(180deg); }

  .nav-year-list {
    max-height: 0;
    overflow: hidden;
    transition: max-height 220ms ease;
  }

  .nav-decade.expanded .nav-year-list { max-height: 400px; }

  .nav-year-item {
    display: block;
    width: 100%;
    background: none;
    border: none;
    font-family: inherit;
    font-size: 14px;
    color: var(--ink-muted);
    padding: 5px 6px 5px 20px;
    cursor: pointer;
    text-align: left;
    border-radius: 6px;
  }

  .nav-year-item:hover { color: var(--ink); background: var(--logo-card-bg); }

  .nav-year-item.active {
    color: var(--ink);
    font-weight: 700;
  }

  .nav-year-item.active::before {
    content: "›";
    display: inline-block;
    width: 12px;
    margin-left: -14px;
  }

  #timeline-col {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 28px;
  }

  .decade-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 6px 48px 24px;
    box-shadow: 0 2px 16px rgba(0,0,0,0.05);
  }

  .decade-heading {
    position: sticky;
    top: 0;
    background: var(--card-bg);
    z-index: 3;
    padding: 26px 0 16px;
    border-radius: 20px 20px 0 0;
  }

  .decade-heading h2 {
    margin: 0;
    font-size: 44px;
    font-weight: 800;
    letter-spacing: -0.01em;
  }

  .decade-meta {
    display: flex;
    align-items: baseline;
    gap: 12px;
    margin-top: 2px;
  }

  .decade-range,
  .decade-count {
    font-size: 14px;
    color: var(--ink-muted);
  }

  .decade-count { font-weight: 600; }

  .decade-bar {
    margin-top: 10px;
    width: 320px;
    max-width: 100%;
    height: 8px;
    border-radius: 4px;
    background: var(--logo-card-bg);
    border: 1px solid var(--border);
    overflow: hidden;
  }

  .decade-bar-fill {
    height: 100%;
    background: var(--placeholder-ink);
    border-radius: 4px;
  }

  .year-heading {
    position: sticky;
    top: var(--decade-header-h, 116px);
    background: var(--card-bg);
    z-index: 2;
    margin: 0;
    padding: 20px 0 14px;
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.01em;
    color: var(--ink-muted);
  }

  .year-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
    padding-bottom: 16px;
  }

  @media (max-width: 900px) {
    .year-grid { grid-template-columns: repeat(2, 1fr); }
  }

  @media (max-width: 560px) {
    .year-grid { grid-template-columns: 1fr; }
  }

  @media (max-width: 720px) {
    #page { flex-direction: column; padding: 0 16px; }
    #year-nav {
      width: 100%;
      position: static;
      max-height: none;
    }
    /* Without an explicit cap, a column-direction flex item sizes to fit
       its widest descendant (e.g. the fixed-width decade progress bar)
       instead of clipping to the viewport, dragging the whole page into
       horizontal overflow — same underlying issue fixed earlier in
       color-wheel.html's #chart-wrap. */
    #timeline-col, .decade-card { width: 100%; max-width: 100%; }
  }

  /* ---- before/after compare card ---- */

  .compare-card {
    background: var(--logo-card-bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .compare-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .compare-row.single {
    justify-content: center;
  }

  .compare-row.single .thumb-col {
    flex: 0 0 50%;
  }

  .thumb-col {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .thumb-label {
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--ink-faint);
    text-align: center;
  }

  .thumb-box {
    height: 96px;
    background: #ffffff;
    border: 1px solid var(--border);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 8px;
    overflow: hidden;
  }

  .thumb-box.before { opacity: 0.8; }

  .thumb-box img {
    display: block;
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
  }

  .thumb-box .fallback-initials {
    font-size: 18px;
    font-weight: 700;
    color: var(--ink-muted);
    display: none;
  }

  .compare-arrow {
    flex: none;
    font-size: 16px;
    color: var(--ink-faint);
    padding-top: 24px;
  }

  .thumb-year {
    font-size: 14px;
    color: var(--ink);
    text-align: center;
  }

  .history-card {
    width: calc((100% - 32px) / 3);
    min-height: 230px;
    margin: 0 0 20px;
    background: var(--placeholder-bg);
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    color: var(--placeholder-ink);
    font-size: 15px;
    font-weight: 600;
    text-align: center;
  }

  @media (max-width: 900px) {
    .history-card { width: calc((100% - 16px) / 2); }
  }

  @media (max-width: 560px) {
    .history-card { width: 100%; }
  }
</style>
</head>
<body>
<div id="page">
  <nav id="year-nav"></nav>
  <div id="timeline-col"></div>
</div>

<script>
const START_YEAR = 1970;
const END_YEAR = 2026;

// A "History" placeholder is scattered in every five years (1970, 1975,
// 1980, ...) rather than every single year — enough to break up the grid
// without a placeholder box competing for attention in every section.
function hasHistoryPlaceholder(year) {
  return (year - START_YEAR) % 5 === 0;
}

function initials(name) {
  const words = name.replace(/[^A-Za-z0-9\s]/g, "").trim().split(/\s+/).filter(Boolean);
  if (words.length >= 2) return (words[0][0] + words[1][0]).toUpperCase();
  return name.replace(/[^A-Za-z0-9]/g, "").slice(0, 2).toUpperCase();
}

function logoUrl(brand, filename) {
  return `logos/${encodeURIComponent(brand)}/${encodeURIComponent(filename)}`;
}

function buildThumb(row, kind) {
  const box = document.createElement("div");
  box.className = `thumb-box ${kind}`;

  const img = document.createElement("img");
  img.src = logoUrl(row.brand, row.filename);
  img.alt = `${row.brand} logo, ${row.year}`;
  box.appendChild(img);

  const fallback = document.createElement("div");
  fallback.className = "fallback-initials";
  fallback.textContent = initials(row.brand);
  box.appendChild(fallback);

  img.addEventListener("error", () => {
    img.style.display = "none";
    fallback.style.display = "block";
  });

  return box;
}

function buildThumbCol(row, kind, label) {
  const col = document.createElement("div");
  col.className = "thumb-col";

  const labelEl = document.createElement("div");
  labelEl.className = "thumb-label";
  labelEl.textContent = label;
  col.appendChild(labelEl);

  col.appendChild(buildThumb(row, kind));

  const year = document.createElement("div");
  year.className = "thumb-year";
  year.textContent = row.year;
  col.appendChild(year);

  return col;
}

// Compares a logo change against whatever came immediately before it for
// that brand — pulled from the brand's full history, not just the
// 1970-2026 window, so a redesign shown here in (say) 1975 still gets
// compared against its real pre-1970 predecessor rather than showing
// nothing. Only called when a prior version actually exists.
function buildCompareCard(row, prevRow) {
  const card = document.createElement("div");
  card.className = "compare-card";

  const compareRow = document.createElement("div");
  compareRow.className = "compare-row";

  compareRow.appendChild(buildThumbCol(prevRow, "before", "Before"));

  const arrow = document.createElement("div");
  arrow.className = "compare-arrow";
  arrow.textContent = "→";
  compareRow.appendChild(arrow);

  compareRow.appendChild(buildThumbCol(row, "after", "After"));

  card.appendChild(compareRow);

  return card;
}

// No prior version exists for this brand yet — there's nothing to compare
// against, so this just shows the single logo rather than a before/after
// pair with a placeholder "before" box.
function buildSingleCard(row) {
  const card = document.createElement("div");
  card.className = "compare-card";

  const single = document.createElement("div");
  single.className = "compare-row single";
  single.appendChild(buildThumbCol(row, "after", "Logo"));
  card.appendChild(single);

  return card;
}

function buildHistoryCard() {
  const card = document.createElement("div");
  card.className = "history-card";
  card.textContent = "History";
  return card;
}

function decadeStart(year) {
  return Math.floor(year / 10) * 10;
}

d3.csv("data/timelines.csv", d3.autoType).then(rows => {
  // Full per-brand history (unfiltered by year) so "before" can reach back
  // past 1970 when a brand's redesign shown here was its first change since
  // an earlier, off-timeline version.
  const byBrandAll = new Map();
  rows.forEach(r => {
    if (!byBrandAll.has(r.brand)) byBrandAll.set(r.brand, []);
    byBrandAll.get(r.brand).push(r);
  });
  byBrandAll.forEach(list => list.sort((a, b) => a.year - b.year));

  function prevVersionOf(row) {
    const list = byBrandAll.get(row.brand);
    const idx = list.indexOf(row);
    return idx > 0 ? list[idx - 1] : null;
  }

  const byYear = new Map();
  rows.forEach(r => {
    if (r.year < START_YEAR || r.year > END_YEAR) return;
    if (!byYear.has(r.year)) byYear.set(r.year, []);
    byYear.get(r.year).push(r);
  });

  const decadeStarts = [];
  for (let y = decadeStart(START_YEAR); y <= END_YEAR; y += 10) decadeStarts.push(y);

  const decadeCounts = decadeStarts.map(ds => {
    let count = 0;
    for (let y = ds; y < ds + 10 && y <= END_YEAR; y++) count += (byYear.get(y) || []).length;
    return count;
  });
  const maxDecadeCount = Math.max(...decadeCounts);

  const timelineCol = document.getElementById("timeline-col");
  const nav = document.getElementById("year-nav");

  decadeStarts.forEach((ds, i) => {
    const decadeEnd = Math.min(ds + 9, END_YEAR);
    const count = decadeCounts[i];

    // Each decade is now its own standalone card (with a gap before the
    // next one) rather than one continuous card holding the whole
    // 1970-2026 span — the sticky decade/year headers still work exactly
    // the same way within each card's own document flow.
    const decadeCard = document.createElement("section");
    decadeCard.className = "decade-card";
    decadeCard.id = `decade-${ds}`;

    const decadeHeading = document.createElement("div");
    decadeHeading.className = "decade-heading";

    const h2 = document.createElement("h2");
    h2.textContent = `${ds}s`;
    decadeHeading.appendChild(h2);

    const meta = document.createElement("div");
    meta.className = "decade-meta";
    meta.innerHTML =
      `<span class="decade-range">${ds}–${decadeEnd}</span>` +
      `<span class="decade-count">${count} logo change${count === 1 ? "" : "s"}</span>`;
    decadeHeading.appendChild(meta);

    const bar = document.createElement("div");
    bar.className = "decade-bar";
    const barFill = document.createElement("div");
    barFill.className = "decade-bar-fill";
    barFill.style.width = `${(count / maxDecadeCount) * 100}%`;
    bar.appendChild(barFill);
    decadeHeading.appendChild(bar);

    decadeCard.appendChild(decadeHeading);

    const decadeBody = document.createElement("div");
    decadeBody.className = "decade-body";

    for (let year = ds; year <= decadeEnd; year++) {
      const rowsForYear = (byYear.get(year) || []).slice().sort((a, b) => a.brand.localeCompare(b.brand));

      const yearSection = document.createElement("section");
      yearSection.className = "year-section";
      yearSection.id = `year-${year}`;

      const yearHeading = document.createElement("h3");
      yearHeading.className = "year-heading";
      yearHeading.textContent = year;
      yearSection.appendChild(yearHeading);

      const grid = document.createElement("div");
      grid.className = "year-grid";
      rowsForYear.forEach(r => {
        const prev = prevVersionOf(r);
        grid.appendChild(prev ? buildCompareCard(r, prev) : buildSingleCard(r));
      });
      yearSection.appendChild(grid);

      if (hasHistoryPlaceholder(year)) {
        yearSection.appendChild(buildHistoryCard());
      }

      decadeBody.appendChild(yearSection);
    }

    decadeCard.appendChild(decadeBody);
    timelineCol.appendChild(decadeCard);

    // ---- sidebar nav entry for this decade ----
    const navGroup = document.createElement("div");
    navGroup.className = "nav-decade";
    navGroup.dataset.decade = ds;

    const navHeader = document.createElement("button");
    navHeader.type = "button";
    navHeader.className = "nav-decade-header";
    navHeader.innerHTML = `<span>${ds}s</span><span class="nav-chevron" aria-hidden="true">&#9662;</span>`;
    navHeader.addEventListener("click", () => {
      const alreadyExpanded = navGroup.classList.contains("expanded");
      setExpandedDecade(alreadyExpanded ? null : ds);
      smoothScrollTo(decadeCard);
    });
    navGroup.appendChild(navHeader);

    const navYearList = document.createElement("div");
    navYearList.className = "nav-year-list";
    for (let year = ds; year <= decadeEnd; year++) {
      const navYear = document.createElement("button");
      navYear.type = "button";
      navYear.className = "nav-year-item";
      navYear.textContent = year;
      navYear.dataset.year = year;
      navYear.addEventListener("click", (event) => {
        event.stopPropagation();
        setActiveYear(year);
        smoothScrollTo(document.getElementById(`year-${year}`));
      });
      navYearList.appendChild(navYear);
    }
    navGroup.appendChild(navYearList);
    nav.appendChild(navGroup);
  });

  const firstDecadeHeading = document.querySelector(".decade-heading");
  if (firstDecadeHeading) {
    document.documentElement.style.setProperty("--decade-header-h", `${firstDecadeHeading.getBoundingClientRect().height}px`);
  }

  // ---- sidebar nav: expand/collapse + scroll-sync ----

  function setExpandedDecade(decadeOrNull) {
    document.querySelectorAll(".nav-decade").forEach(g => {
      g.classList.toggle("expanded", +g.dataset.decade === decadeOrNull);
    });
  }

  function setActiveYear(year) {
    document.querySelectorAll(".nav-year-item").forEach(item => {
      item.classList.toggle("active", +item.dataset.year === year);
    });
  }

  // A click-triggered smooth scroll fires the IntersectionObserver below on
  // every frame it's in transit — without suppressing those in-flight
  // updates, the observer "sees" whatever section is passing by mid-scroll
  // and overwrites the very selection the click just made, so the nav can
  // settle on the wrong decade once the animation finishes. `scrollend`
  // (with a timeout fallback for browsers that lack it) marks exactly when
  // it's safe to let scroll position drive the nav again.
  let suppressObserver = false;
  let suppressTimer = null;
  function smoothScrollTo(el) {
    suppressObserver = true;
    clearTimeout(suppressTimer);
    suppressTimer = setTimeout(() => { suppressObserver = false; }, 1200);
    el.scrollIntoView({ behavior: "smooth", block: "start" });
  }
  window.addEventListener("scrollend", () => {
    suppressObserver = false;
    clearTimeout(suppressTimer);
  });

  setExpandedDecade(decadeStarts[0]);
  setActiveYear(START_YEAR);

  // As the reader scrolls (on their own, not via a nav click), the sidebar
  // tracks along: whichever year section is currently crossing the top of
  // the viewport becomes the active item, and its parent decade
  // auto-expands (collapsing whichever was open before).
  const yearObserver = new IntersectionObserver((entries) => {
    if (suppressObserver) return;
    entries.forEach(entry => {
      if (!entry.isIntersecting) return;
      const year = +entry.target.id.replace("year-", "");
      setActiveYear(year);
      setExpandedDecade(decadeStart(year));
    });
  }, { rootMargin: "-15% 0px -75% 0px" });

  document.querySelectorAll(".year-section").forEach(el => yearObserver.observe(el));
}).catch(err => {
  console.error("Failed to load data/timelines.csv", err);
  document.getElementById("timeline-col").innerHTML =
    "<p style='padding:24px;color:#c0392b;'>Failed to load data/timelines.csv. Serve this folder with " +
    "<code>python3 -m http.server 8000</code> and open it via http://localhost, not file://.</p>";
});
</script>
</body>
</html>
