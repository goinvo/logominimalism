<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Brand Color Palettes</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<style>
  :root {
    --bg: #ffffff;
    --panel-bg: #ffffff;
    --ink: #1c1c1a;
    --ink-muted: #6b6b67;
    --ink-faint: #9a9a95;
    --dot-grid: #dedcd6;
    --chart-bg: #fbfbf9;
    --axis: #8f8f8a;
    --rug: #b7b7b1;
    --card-bg: #ffffff;
    --card-border: #e6e5e0;

    --c-restaurants: #E8472A;
    --c-retail: #2563EB;
    --c-tech: #7C3AED;
    --c-fashion: #0D9488;
    --c-shipping: #D97706;
    --c-food: #DC2626;
    --c-auto: #475569;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    overflow-x: hidden;
  }

  #app {
    min-width: 760px;
    max-width: 1180px;
    margin: 0 auto;
    padding: 24px 24px 32px 24px;
  }

  #nav-row {
    display: flex;
    gap: 18px;
    font-size: 13px;
    font-weight: 600;
    color: var(--ink-muted);
    margin-bottom: 18px;
  }

  #nav-row a {
    color: var(--ink-muted);
    text-decoration: none;
  }

  #nav-row a.current {
    color: var(--ink);
    border-bottom: 2px solid var(--ink);
    padding-bottom: 2px;
  }

  #nav-row a:hover {
    color: var(--ink);
  }

  #hint-row {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 22px;
    margin-bottom: 10px;
  }

  #hint-filter {
    width: 200px;
    flex: none;
    font-size: 15px;
    font-weight: 600;
    color: var(--ink);
  }

  #sort-control {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
    color: var(--ink-muted);
  }

  #sort-control label {
    font-weight: 600;
    color: var(--ink);
  }

  .sort-btn {
    background: #ffffff;
    border: 1px solid #e2e2dd;
    color: var(--ink-muted);
    font-size: 12.5px;
    font-weight: 500;
    padding: 6px 12px;
    border-radius: 8px;
    cursor: pointer;
    transition: background 160ms ease, border-color 160ms ease, color 160ms ease;
  }

  .sort-btn:hover {
    border-color: #c9c9c2;
    color: var(--ink);
  }

  .sort-btn.active {
    background: color-mix(in srgb, var(--ink) 8%, #ffffff);
    border-color: var(--ink);
    color: var(--ink);
  }

  #layout {
    display: flex;
    align-items: flex-start;
    gap: 22px;
  }

  #filters {
    display: flex;
    flex-direction: column;
    gap: 6px;
    width: 200px;
    flex: none;
  }

  .filter-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    background: #ffffff;
    border: 1px solid #e2e2dd;
    color: var(--ink-muted);
    font-size: 13px;
    font-weight: 500;
    padding: 8px 12px;
    border-radius: 10px;
    cursor: pointer;
    text-align: left;
    transition: background 160ms ease, border-color 160ms ease, color 160ms ease;
  }

  .filter-btn .swatch {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--dot-swatch, var(--ink-muted));
    flex: none;
  }

  .filter-btn:hover {
    border-color: #c9c9c2;
    color: var(--ink);
  }

  .filter-btn.active {
    background: color-mix(in srgb, var(--dot-swatch, #666) 12%, #ffffff);
    border-color: var(--dot-swatch, #666);
    color: var(--ink);
  }

  #grid-wrap {
    position: relative;
    flex: 1;
    min-width: 0;
    background-color: var(--chart-bg);
    background-image: radial-gradient(circle, var(--dot-grid) 1px, transparent 1.5px);
    background-size: 22px 22px;
    border: 1px solid #ececE7;
    border-radius: 10px;
    padding: 20px;
  }

  #grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(168px, 1fr));
    gap: 12px;
  }

  .brand-card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 8px;
    padding: 10px 10px 9px;
    cursor: pointer;
    transition: border-color 160ms ease, box-shadow 160ms ease;
  }

  .brand-card:hover {
    border-color: #c9c9c2;
    box-shadow: 0 4px 12px rgba(20, 20, 10, 0.08);
  }

  .brand-card .card-name {
    font-size: 12.5px;
    font-weight: 700;
    color: var(--ink);
    margin-bottom: 8px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .swatch-row {
    display: flex;
    align-items: center;
    gap: 5px;
    margin-bottom: 4px;
  }

  .swatch-row .row-label {
    width: 30px;
    flex: none;
    font-size: 10px;
    color: var(--ink-faint);
  }

  .swatch-track {
    display: flex;
    gap: 2px;
    flex: 1;
    min-width: 0;
  }

  .swatch {
    width: 14px;
    height: 24px;
    border-radius: 2px;
    border: 1px solid rgba(0,0,0,0.06);
    flex: none;
  }

  .swatch.blank {
    border: 1px dashed #e2e2dd;
    background: transparent;
  }

  .card-caption {
    font-size: 10.5px;
    color: var(--ink-muted);
    margin-top: 6px;
  }

  /* side panel */
  #overlay {
    position: fixed;
    inset: 0;
    background: rgba(20, 20, 15, 0.15);
    opacity: 0;
    pointer-events: none;
    transition: opacity 200ms ease;
    z-index: 39;
  }

  #overlay.open {
    opacity: 1;
    pointer-events: auto;
  }

  #side-panel {
    position: fixed;
    top: 0;
    right: 0;
    bottom: 0;
    width: 440px;
    max-width: 92vw;
    background: var(--panel-bg);
    border-left: 1.5px solid #4b4b48;
    box-shadow: -12px 0 30px rgba(20, 20, 10, 0.12);
    padding: 26px 26px 32px;
    overflow-y: auto;
    z-index: 40;
    transform: translateX(100%);
    transition: transform 240ms cubic-bezier(.2,.8,.3,1);
  }

  #side-panel.open {
    transform: translateX(0);
  }

  #panel-close {
    position: absolute;
    top: 16px;
    right: 18px;
    background: none;
    border: none;
    color: var(--ink-muted);
    font-size: 22px;
    line-height: 1;
    cursor: pointer;
    padding: 4px;
  }

  #panel-close:hover { color: var(--ink); }

  #panel-content h2 {
    margin: 0 24px 4px 0;
    font-size: 24px;
    font-weight: 700;
    color: var(--ink);
  }

  .panel-years {
    color: var(--ink-muted);
    font-size: 14px;
    margin-bottom: 22px;
  }

  .version-row {
    margin-bottom: 18px;
  }

  .version-row .version-year {
    font-size: 12.5px;
    font-weight: 600;
    color: var(--ink-muted);
    margin-bottom: 6px;
  }

  .version-row .swatch-track .swatch {
    width: 30px;
    height: 30px;
  }
</style>
</head>
<body>
<div id="app">
  <div id="nav-row">
    <a href="index.html">Story</a>
    <a href="chart.html">Complexity chart</a>
    <a href="hue-chart.html">Hue families</a>
    <a href="palettes.html" class="current">Color palettes</a>
  </div>
  <div id="hint-row">
    <div id="hint-filter">Filter by industry</div>
    <div id="sort-control">
      <label>Sort by</label>
      <button class="sort-btn active" data-sort="complexity">Complexity change</button>
      <button class="sort-btn" data-sort="colorfulness">Colorfulness change</button>
      <button class="sort-btn" data-sort="alphabetical">Alphabetical</button>
      <button class="sort-btn" data-sort="industry">Industry</button>
    </div>
  </div>
  <div id="layout">
    <nav id="filters"></nav>
    <div id="grid-wrap">
      <div id="grid"></div>
    </div>
  </div>
</div>

<div id="overlay"></div>
<div id="side-panel">
  <button id="panel-close" aria-label="Close">&times;</button>
  <div id="panel-content"></div>
</div>

<script>
const INDUSTRIES = [
  { key: "all",         label: "All" },
  { key: "restaurants",  label: "Restaurants" },
  { key: "retail",       label: "Retail" },
  { key: "tech",         label: "Tech" },
  { key: "fashion",      label: "Fashion" },
  { key: "shipping",     label: "Shipping" },
  { key: "food",         label: "Food & CPG" },
  { key: "auto",         label: "Auto" },
];

const COLORS = {
  restaurants: "#E8472A",
  retail:      "#2563EB",
  tech:        "#7C3AED",
  fashion:     "#0D9488",
  shipping:    "#D97706",
  food:        "#DC2626",
  auto:        "#475569",
};

const INDUSTRY_ORDER = INDUSTRIES.map(d => d.key).filter(k => k !== "all");
const MAX_SWATCHES = 8;

let activeIndustry = "all";
let activeSort = "complexity";
let brands = [];
let timelinesByBrand = new Map();

function buildFilters() {
  const wrap = d3.select("#filters");
  const btns = wrap.selectAll(".filter-btn")
    .data(INDUSTRIES, d => d.key)
    .enter()
    .append("button")
    .attr("class", d => "filter-btn" + (d.key === activeIndustry ? " active" : ""))
    .attr("data-key", d => d.key)
    .style("--dot-swatch", d => COLORS[d.key] || "#888");

  btns.append("span").attr("class", "swatch");
  btns.append("span").text(d => d.label);

  btns.on("click", (event, d) => {
    activeIndustry = d.key;
    d3.selectAll(".filter-btn").classed("active", dd => dd.key === activeIndustry);
    renderGrid();
  });
}

function buildSortControl() {
  d3.selectAll(".sort-btn").on("click", function() {
    activeSort = this.getAttribute("data-sort");
    d3.selectAll(".sort-btn").classed("active", function() { return this.getAttribute("data-sort") === activeSort; });
    renderGrid();
  });
}

function parsePalette(row) {
  if (!row || !row.palette) return [];
  return String(row.palette).split(",").map(s => s.trim()).filter(Boolean);
}

function swatchRow(colors, label) {
  const row = document.createElement("div");
  row.className = "swatch-row";
  const rowLabel = document.createElement("div");
  rowLabel.className = "row-label";
  rowLabel.textContent = label;
  row.appendChild(rowLabel);

  const track = document.createElement("div");
  track.className = "swatch-track";
  for (let i = 0; i < MAX_SWATCHES; i++) {
    const sw = document.createElement("div");
    if (colors[i]) {
      sw.className = "swatch";
      sw.style.background = colors[i];
      sw.title = colors[i];
    } else {
      sw.className = "swatch blank";
    }
    track.appendChild(sw);
  }
  row.appendChild(track);
  return row;
}

function hueLabel(count) {
  return `${count} hue${count === 1 ? "" : "s"}`;
}

function sortBrands(list) {
  const sorted = list.slice();
  if (activeSort === "complexity") {
    sorted.sort((a, b) => a.complexity_change_score - b.complexity_change_score);
  } else if (activeSort === "colorfulness") {
    sorted.sort((a, b) => a.sat_delta_total - b.sat_delta_total);
  } else if (activeSort === "alphabetical") {
    sorted.sort((a, b) => a.brand.localeCompare(b.brand));
  } else if (activeSort === "industry") {
    sorted.sort((a, b) => {
      const ia = INDUSTRY_ORDER.indexOf(a.industry);
      const ib = INDUSTRY_ORDER.indexOf(b.industry);
      if (ia !== ib) return ia - ib;
      return a.brand.localeCompare(b.brand);
    });
  }
  return sorted;
}

function renderGrid() {
  const filtered = activeIndustry === "all" ? brands : brands.filter(d => d.industry === activeIndustry);
  const ordered = sortBrands(filtered);

  const grid = d3.select("#grid");
  grid.selectAll("*").remove();

  const cards = grid.selectAll(".brand-card")
    .data(ordered, d => d.brand)
    .enter()
    .append("div")
    .attr("class", "brand-card")
    .on("click", (event, d) => openPanel(d));

  cards.each(function(d) {
    const card = d3.select(this);
    card.append("div").attr("class", "card-name").text(d.brand);

    const rows = (timelinesByBrand.get(d.brand) || []).slice().sort((a, b) => a.year - b.year);
    const firstRow = rows[0];
    const lastRow = rows[rows.length - 1];

    card.node().appendChild(swatchRow(parsePalette(firstRow), "then"));
    card.node().appendChild(swatchRow(parsePalette(lastRow), "now"));

    const caption = document.createElement("div");
    caption.className = "card-caption";
    caption.textContent = `${hueLabel(d.hue_families_first)} → ${hueLabel(d.hue_families_last)}`;
    card.node().appendChild(caption);
  });
}

function openPanel(d) {
  const rows = (timelinesByBrand.get(d.brand) || []).slice().sort((a, b) => a.year - b.year);
  const content = document.getElementById("panel-content");
  content.innerHTML = `
    <h2>${d.brand}</h2>
    <div class="panel-years">${d.year_first} – ${d.year_last} · ${hueLabel(d.hue_families_first)} → ${hueLabel(d.hue_families_last)}</div>
  `;
  rows.forEach(r => {
    const versionRow = document.createElement("div");
    versionRow.className = "version-row";
    const yearLabel = document.createElement("div");
    yearLabel.className = "version-year";
    yearLabel.textContent = r.year;
    versionRow.appendChild(yearLabel);
    versionRow.appendChild(swatchRow(parsePalette(r), ""));
    content.appendChild(versionRow);
  });

  document.getElementById("overlay").classList.add("open");
  document.getElementById("side-panel").classList.add("open");
}

function closePanel() {
  document.getElementById("overlay").classList.remove("open");
  document.getElementById("side-panel").classList.remove("open");
}

document.getElementById("panel-close").addEventListener("click", closePanel);
document.getElementById("overlay").addEventListener("click", closePanel);
document.addEventListener("keydown", (event) => {
  if (event.key === "Escape") closePanel();
});

Promise.all([
  d3.csv("data/summary.csv", d3.autoType),
  d3.csv("data/timelines.csv", d3.autoType),
]).then(([summary, timelines]) => {
  timelines.forEach(r => {
    if (!timelinesByBrand.has(r.brand)) timelinesByBrand.set(r.brand, []);
    timelinesByBrand.get(r.brand).push(r);
  });

  brands = summary;

  buildFilters();
  buildSortControl();
  renderGrid();
}).catch(err => {
  console.error("Failed to load data", err);
  d3.select("#grid-wrap").append("div")
    .style("color", "#c0392b")
    .style("padding", "24px")
    .text("Failed to load data/summary.csv or data/timelines.csv. Serve this folder with `python3 -m http.server 8000` and open it via http://localhost, not file://.");
});
</script>
</body>
</html>
